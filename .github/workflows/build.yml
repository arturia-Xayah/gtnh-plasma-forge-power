name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, run unit tests and verify distribution
        run: ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: plasmaforgepower-0.2.0-alpha-GTNH-2.9.0-RC-2
          path: build/libs/plasmaforgepower-0.2.0-alpha.jar
          if-no-files-found: error
